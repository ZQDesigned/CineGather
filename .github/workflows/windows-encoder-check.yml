name: windows-encoder-check
on:
  workflow_dispatch:
  push:
    paths:
      - native/capture/windows-host.cpp
      - native/capture/build-windows.py
      - native/capture/encoder-selection.hpp
      - native/capture/patch-qsv-adapter.py
      - native/capture/test/encoder-selection.cpp
      - tools/validation/windows/native-smoke.ts
      - .github/workflows/windows-encoder-check.yml
jobs:
  native-encoders:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - run: bun tools/windows-audio-build.ts
      - run: python native/capture/build-windows.py
        env:
          CG_PROTOCOL_TEST: "1"
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun tools/validation/windows/native-smoke.ts .local/native-runtime/windows/obs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-encoder-evidence
          include-hidden-files: true
          path: .local/encoder-verification/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-encoder-runtime
          include-hidden-files: true
          path: |
            .local/native-runtime/windows/obs/**
            .local/native-runtime/windows/CGProcessAudioHost.exe
            apps/desktop/release/*-native-source.zip
