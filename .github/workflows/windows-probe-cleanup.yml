name: windows-probe-cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - apps/desktop/resources/installer-processes.ps1
      - tools/validation/windows/probe-cleanup-smoke.ps1
      - .github/workflows/windows-probe-cleanup.yml
jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tools/validation/windows/probe-cleanup-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encoder-probe-cleanup-evidence
          include-hidden-files: true
          path: .local/probe-cleanup-verification/*.json
