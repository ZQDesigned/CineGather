name: windows-upgrade
on:
  push:
    paths:
      - tools/windows-upgrade-smoke.ps1
      - apps/desktop/resources/installer.nsh
      - apps/desktop/resources/installer-processes.ps1
      - .github/workflows/windows-upgrade.yml
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce installed application upgrade
        shell: pwsh
        run: ./tools/windows-upgrade-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-upgrade-evidence
          include-hidden-files: true
          path: .local/windows-upgrade/
