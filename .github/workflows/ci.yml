name: verify
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/game-link/go.mod
          cache-dependency-path: native/game-link/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run infra:up
      - run: bun run db:migrate
      - run: bun run format:check
      - run: bun run check
      - run: go test -race -tags noweb ./...
        working-directory: native/game-link
      - run: bun run test:integration
      - run: bun run api:generate && git diff --exit-code packages/api-client/src/schema.ts
      - run: bun run build
      - run: bun run build:web
      - run: docker build -t cinegather-api:0.1.0 -f apps/api/Dockerfile .
      - run: docker build -t cinegather-web:0.1.0 -f apps/web/Dockerfile .
      - run: bun run test:container
      - run: bun tools/check-git.ts
  browser-checks:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-1
            suite: e2e
            shard: 1/4
          - name: e2e-2
            suite: e2e
            shard: 2/4
          - name: e2e-3
            suite: e2e
            shard: 3/4
          - name: e2e-4
            suite: e2e
            shard: 4/4
          - name: web
            suite: web
    # Each runner owns its database and media services. Keep one worker per
    # runner because registration-policy and room tests share server state.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/game-link/go.mod
          cache-dependency-path: native/game-link/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run infra:up
      - run: bun run db:migrate
      - run: bun run build
      - run: bun run build:web
      - run: bunx playwright install --with-deps chromium chrome
      - if: matrix.suite == 'e2e'
        run: bun run test:e2e --shard=${{ matrix.shard }}
      - if: matrix.suite == 'web'
        run: bun run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics-${{ matrix.name }}
          include-hidden-files: true
          path: |
            test-results/
            .local/chrome-support/web-results/
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/game-link/go.mod
          cache-dependency-path: native/game-link/go.sum
      - run: bun tools/windows-audio-build.ts
      - run: go mod tidy && go build -o ../../../.local/pion-whip-smoke.exe .
        working-directory: tools/validation/pion-whip-smoke
      - run: python native/capture/build-windows.py && bun tools/validation/windows/pion-smoke.ts .local/native-runtime/windows/obs
        env:
          CG_PROTOCOL_TEST: "1"
      - run: bun install --frozen-lockfile
      - run: bun test apps/desktop/test/stardew-worlds.test.ts
      - run: bun run setup
      - run: bun tools/validation/native-preview-check.ts --probe-default
      - run: bun run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VITE_API_URL: https://cgplat.zqdesigned.city
          VITE_WEB_URL: https://cgplat.zqdesigned.city
      - run: bun tools/validation/windows/pion-smoke.ts .local/native-runtime/windows/obs
      - run: bun tools/validation/package-smoke.ts win32
      - uses: actions/upload-artifact@v4
        with:
          name: cinegather-windows-x64-unsigned
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*-native-source.zip
