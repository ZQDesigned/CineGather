name: cinegather
services:
  postgres:
    image: registry-1.docker.io/library/postgres:17.6-alpine
    environment:
      POSTGRES_USER: cinegather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bun run setup}
      POSTGRES_DB: cinegather
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinegather -d cinegather"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: registry-1.docker.io/library/redis:7-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    restart: unless-stopped
  ingress:
    image: registry-1.docker.io/livekit/ingress:v1.5.0
    command: ["--config", "/etc/ingress.yaml"]
    volumes:
      - ../../.local/ingress.yaml:/etc/ingress.yaml:ro
    ports:
      - "127.0.0.1:7885:7885"
      - "127.0.0.1:7887:7887"
      - "127.0.0.1:7886:7886/udp"
      - "127.0.0.1:7888:7888"
    depends_on: [livekit, redis]
    restart: unless-stopped
  livekit:
    image: registry-1.docker.io/livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ../../.local/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:${LIVEKIT_UDP_START:-40000}-${LIVEKIT_UDP_END:-40100}:${LIVEKIT_UDP_START:-40000}-${LIVEKIT_UDP_END:-40100}/udp"
    depends_on: [redis]
    restart: unless-stopped
volumes:
  postgres-data:
