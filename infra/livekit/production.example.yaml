port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
redis:
  address: 127.0.0.1:6379
  password: REPLACE_REDIS_PASSWORD
ingress:
  whip_base_url: https://whip.example.com/w
turn:
  enabled: true
  domain: turn.example.com
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/livekit-certs/fullchain.pem
  key_file: /etc/livekit-certs/privkey.pem
keys:
  REPLACE_API_KEY: REPLACE_32_CHARACTER_MINIMUM_SECRET
webhook:
  api_key: REPLACE_API_KEY
  urls:
    - https://api.example.com/api/v1/livekit/webhook
logging:
  level: warn
