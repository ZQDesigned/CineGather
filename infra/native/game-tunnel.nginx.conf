# Merge into the existing API server block. Never expose the FRPS admission plugin.
location ^~ /api/v1/internal/ { return 404; }
# Identity metadata/token endpoint must reach API directly, without CDN caching.
location ^~ /api/v1/game-tunnel/identity/ {
  proxy_pass http://127.0.0.1:14310;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 10s;
  add_header Cache-Control "no-store" always;
}
