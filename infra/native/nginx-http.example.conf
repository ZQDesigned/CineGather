# Include inside the existing nginx http block, after obtaining the SAN certificate.
server {
    listen 80;
    server_name app.example.com media.example.com whip.example.com turn.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cinegather/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name app.example.com;
    ssl_certificate /etc/cinegather/tls/fullchain.pem;
    ssl_certificate_key /etc/cinegather/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    root /opt/cinegather/current/apps/web/dist;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(self), display-capture=(self)' always;
    add_header Cache-Control no-cache;
    access_log off;
    location /api/ {
        proxy_pass http://127.0.0.1:14310;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /updates/ {
        alias /var/lib/cinegather/updates/;
        autoindex off;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }
    location /downloads/ {
        alias /var/lib/cinegather/downloads/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri /index.html;
    }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name media.example.com;
    ssl_certificate /etc/cinegather/tls/fullchain.pem;
    ssl_certificate_key /etc/cinegather/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name whip.example.com;
    ssl_certificate /etc/cinegather/tls/fullchain.pem;
    ssl_certificate_key /etc/cinegather/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
