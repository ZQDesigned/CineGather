# Include inside the existing nginx http block, after obtaining the SAN certificate.
server {
    listen 80;
    server_name app.example.com media.example.com whip.example.com turn.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cinegather/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name app.example.com;
    ssl_certificate /etc/cinegather/tls/fullchain.pem;
    ssl_certificate_key /etc/cinegather/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    root /opt/cinegather/current/apps/web/dist;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(self), display-capture=(self)' always;
    add_header Cache-Control no-cache;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cinegather/acme;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    error_page 503 = @cinegather_maintenance;
    location @cinegather_maintenance {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-CineGather-Maintenance "1" always;
        add_header Access-Control-Allow-Origin "app://cinegather" always;
        add_header Access-Control-Expose-Headers "Retry-After, X-CineGather-Maintenance, X-Request-Id" always;
        add_header Vary Origin always;
        return 503 '{"code":"SERVER_MAINTENANCE","message":"服务器正在维护，请稍后重试。","requestId":"$request_id"}';
    }
    location = /api/v1/internal/esports-admission { return 404; }
    location = /api/v1/room-activities/ws {
        if (-f /etc/cinegather/maintenance.json) { return 503; }
        proxy_pass http://127.0.0.1:14310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header EO-Connecting-IP $http_eo_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
    location ~ ^/api/v1/rooms/[0-9a-f-]+/activity/images$ {
        client_max_body_size 3m;
        if (-f /etc/cinegather/maintenance.json) { return 503; }
        proxy_pass http://127.0.0.1:14310;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header EO-Connecting-IP $http_eo_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        # Preflight must succeed so cross-origin clients can read the 503 JSON.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "app://cinegather" always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-CineGather-Features, X-CineGather-Protocols, X-CineGather-Version, X-CineGather-Platform, X-CineGather-Runtime, X-CineGather-Build, X-CineGather-Revision, X-CineGather-Channel" always;
            add_header Vary Origin always;
            return 204;
        }
        # Keep returning maintenance JSON even while the API is stopped.
        if (-f /etc/cinegather/maintenance.json) { return 503; }
        proxy_pass http://127.0.0.1:14310;
        proxy_set_header Host $host;
        # Never append client-supplied XFF: the API validates this transport peer
        # against TRUSTED_CDN_CIDRS_FILE before accepting EO-Connecting-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header EO-Connecting-IP $http_eo_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /updates/ {
        alias /var/lib/cinegather/updates/;
        autoindex off;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }
    location = /downloads/windows-latest.json {
        alias /var/lib/cinegather/downloads/windows-latest.json;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }
    location = /downloads/mobile-latest.json {
        alias /var/lib/cinegather/downloads/mobile-latest.json;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/downloads/(CineGather-[0-9]+\.[0-9]+\.[0-9]+-android-arm64\.apk)$ {
        alias /var/lib/cinegather/downloads/$1;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/downloads/(CineGather-[0-9]+\.[0-9]+\.[0-9]+-ios-self-sign\.ipa)$ {
        alias /var/lib/cinegather/downloads/$1;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /downloads/ {
        alias /var/lib/cinegather/downloads/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri /index.html;
    }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name media.example.com;
    ssl_certificate /etc/cinegather/tls/fullchain.pem;
    ssl_certificate_key /etc/cinegather/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location ~ ^/rtc(?:/v1)?(?:/validate)?$ {
        # API relays signalling while holding fresh admission through SFU join.
        # RTP still travels directly to LiveKit's configured media ports.
        proxy_pass http://127.0.0.1:14310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    # No alternate public RTC route may bypass fresh admission. SDK Twirp and
    # ingress control use the private loopback listener, not this public host.
    location / { return 404; }
    location = /healthz { return 200 "ok"; }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name whip.example.com;
    ssl_certificate /etc/cinegather/tls/fullchain.pem;
    ssl_certificate_key /etc/cinegather/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
