# Include inside the existing nginx stream block. Public TCP 443 must be free.
map $ssl_preread_server_name $cinegather_tls_upstream {
    turn.example.com 127.0.0.1:5348;
    default 127.0.0.1:8443;
}
server {
    listen 443;
    ssl_preread on;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_pass $cinegather_tls_upstream;
    access_log off;
}
