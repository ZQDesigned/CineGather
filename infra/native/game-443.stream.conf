# Merge into nginx stream configuration; preserve the existing TURN SNI mapping.
# The native helper advertises this ALPN over certificate-verified TLS.
map $ssl_preread_alpn_protocols $cinegather_public_upstream {
    ~cinegather-game 127.0.0.1:17444;
    default $cinegather_tls_upstream;
}
# Existing public 443 server: change only proxy_pass to $cinegather_public_upstream.
# That listener sends PROXY protocol to existing HTTPS/TURN upstreams. Strip it
# on this loopback hop before forwarding the original end-to-end TLS to FRPS.
server {
    listen 127.0.0.1:17444 proxy_protocol;
    proxy_protocol off;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_pass 127.0.0.1:17443;
    access_log off;
}
# FRPS must bind 127.0.0.1:17443, not a public address in this topology.
